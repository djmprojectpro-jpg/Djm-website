<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery • DJM Project Pro's</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] text-white">
    <nav class="bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-x-3">
                    <img src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/428c1544-bbc4-401e-92de-b3bf4e9b9559/image.jpg" alt="DJM" class="h-11 w-11 object-contain">
                    <div>
                        <div class="font-bold text-2xl tracking-tighter">DJM Project Pro's</div>
                        <div class="text-[10px] text-orange-500 font-medium -mt-1 tracking-[1.5px]">Carbon County, PA</div>
                    </div>
                </div>
                <a href="index.html" class="text-sm hover:text-orange-400">← Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold mb-2">Project Gallery</h1>
        <p class="text-zinc-400 mb-10">Real work completed across Carbon County, PA</p>

        <div class="mb-16">
            <h2 class="text-3xl font-bold mb-8">Recent jobs</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                <img src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/b032b8e2-6fb8-4386-9723-c9fce2070d4b/image.jpg" data-src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/b032b8e2-6fb8-4386-9723-c9fce2070d4b/image.jpg" data-caption="Porch columns and rail" class="gallery-item w-full aspect-[4/3] object-cover rounded-xl cursor-pointer hover:opacity-90 transition" alt="Porch columns and rail">
                <img src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/7f25b761-c2d4-479f-9abd-920403b4d11c/image.jpg" data-src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/7f25b761-c2d4-479f-9abd-920403b4d11c/image.jpg" data-caption="Deck with black rail and gravel" class="gallery-item w-full aspect-[4/3] object-cover rounded-xl cursor-pointer hover:opacity-90 transition" alt="Deck with black rail and gravel">
                <img src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/9880ccf0-f57d-42b4-ad96-9576618ad47a/image.jpg" data-src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/9880ccf0-f57d-42b4-ad96-9576618ad47a/image.jpg" data-caption="New wood deck" class="gallery-item w-full aspect-[4/3] object-cover rounded-xl cursor-pointer hover:opacity-90 transition" alt="New wood deck">
                <img src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/639fd491-d6c5-4968-816c-6382ac8ddd18/image.jpg" data-src="https://assets-2-prod.whop.com/public/uploads/2026-09-11/639fd491-d6c5-4968-816c-6382ac8ddd18/image.jpg" data-caption="Front beds and paint" class="gallery-item w-full aspect-[4/3] object-cover rounded-xl cursor-pointer hover:opacity-90 transition" alt="Front beds and paint">
            </div>
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div onclick="event.stopImmediatePropagation()" class="relative max-w-6xl w-full">
            <button onclick="closeLightbox()" class="absolute -top-14 right-0 text-white text-4xl hover:text-orange-400">✕</button>
            <img id="lightboxImage" class="w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl">
            <div id="lightboxCaption" class="text-center mt-5 text-xl text-zinc-300"></div>
            <button onclick="prevImage(event)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-orange-600 text-white text-4xl px-5 py-3 rounded-full">←</button>
            <button onclick="nextImage(event)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-orange-600 text-white text-4xl px-5 py-3 rounded-full">→</button>
        </div>
    </div>

    <footer class="bg-black border-t border-zinc-800 py-10 text-center text-sm text-zinc-400 mt-12">
        <p>DJM Project Pro's • Carbon County, PA • (272) 394-5428</p>
    </footer>

    <script>
        let currentIndex = 0;
        let galleryItems = [];
        function initGallery() {
            galleryItems = Array.from(document.querySelectorAll('.gallery-item'));
            galleryItems.forEach((item, index) => item.addEventListener('click', () => openLightbox(index)));
        }
        function openLightbox(index) {
            currentIndex = index;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImage');
            const caption = document.getElementById('lightboxCaption');
            const item = galleryItems[currentIndex];
            img.src = item.dataset.src;
            caption.textContent = item.dataset.caption || '';
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('flex');
            lightbox.classList.add('hidden');
        }
        function nextImage(e) {
            e.stopImmediatePropagation();
            currentIndex = (currentIndex + 1) % galleryItems.length;
            updateLightbox();
        }
        function prevImage(e) {
            e.stopImmediatePropagation();
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            updateLightbox();
        }
        function updateLightbox() {
            const img = document.getElementById('lightboxImage');
            const caption = document.getElementById('lightboxCaption');
            const item = galleryItems[currentIndex];
            img.src = item.dataset.src;
            caption.textContent = item.dataset.caption || '';
        }
        document.addEventListener('keydown', function(e) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('hidden')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage(e);
            if (e.key === 'ArrowLeft') prevImage(e);
        });
        window.onload = initGallery;
    </script>
</body>
</html>
